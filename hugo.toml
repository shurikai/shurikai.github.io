baseURL = 'https://shurikai.github.io/'
languageCode = 'en-us'
title = 'Jason'
theme = 'PaperMod'

[pagination]
    pagerSize = 10

[params]
    author = "Jason Chestnut"
    description = "Developer & Tinkerer"
    ShowReadingTime = true
    ShowShareButtons = false
    ShowPostNavLinks = true
    ShowBreadCrumbs = true
    ShowCodeCopyButtons = true
    mainSections = ["posts"]
    homeInfoParams = { Title = "Hi, I'm Jason.", Content = "I've spent 27 years building distributed systems, from defense training simulators to event-driven backends. Here I write about Go, AI tooling, and keeping a career honest, including the things I should have learned sooner." }

    [params.home]
        kicker = "software architect · distributed systems"
        topics = [
            { name = "go", url = "/tags/go/" },
            { name = "ai tooling", url = "/tags/ai/" },
            { name = "career", url = "/tags/career/" },
            { name = "projects", url = "/projects/" },
        ]

    [[params.socialIcons]]
        name = "github"
        url = 'https://github.com/shurikai'

[menu]
    [[menu.main]]
        name = 'posts'
        url = '/posts/'
        weight = 1
    [[menu.main]]
        name = 'projects'
        url = '/projects/'
        weight = 2
    [[menu.main]]
        name = 'now'
        url = '/now/'
        weight = 3
    [[menu.main]]
        name = 'archive'
        url = '/archives/'
        weight = 4
    
